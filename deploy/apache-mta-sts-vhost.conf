# New vhost for MTA-STS policy hosting, on the .11 host (same box that already
# runs appelo.nl, paste.appelo.nl, borg.appelo.nl, etc.).
#
# Install:
#   sudo cp apache-mta-sts-vhost.conf /etc/apache2/sites-available/mta-sts.appelo.nl.conf
#   sudo mkdir -p /var/www/mta-sts.appelo.nl/.well-known
#   sudo cp mta-sts.txt /var/www/mta-sts.appelo.nl/.well-known/mta-sts.txt
#   sudo chown -R bas:bas /var/www/mta-sts.appelo.nl
#   sudo a2ensite mta-sts.appelo.nl.conf
#   sudo systemctl reload apache2
#
# Then, once the DNS A record for mta-sts.appelo.nl resolves (see below),
# get the cert the same way the other subdomains on this host got theirs:
#   sudo certbot --apache -d mta-sts.appelo.nl
# certbot will create the matching *-le-ssl.conf itself (with the SSL cert
# lines and the http->https redirect), same pattern as paste.appelo.nl.
#
# DNS records to add (this part is on you):
#   mta-sts.appelo.nl.   A      45.142.232.176   (same IP as the other subdomains)
#   _mta-sts.appelo.nl.  TXT    "v=STSv1; id=20260728000000"
#
# The "id" value just has to change every time mta-sts.txt's content changes
# (e.g. when moving from mode: testing to mode: enforce) — a timestamp is a
# reasonable convention, no other meaning to it.

<VirtualHost *:80>
    ServerName mta-sts.appelo.nl
    DocumentRoot /var/www/mta-sts.appelo.nl/
    ServerAdmin bas@appelo.nl

    <Directory /var/www/mta-sts.appelo.nl>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
