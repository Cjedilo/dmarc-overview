# Add inside the existing appelo.nl SSL vhost
# (/etc/apache2/sites-enabled/appelo.nl-le-ssl.conf), alongside the existing
# /chat/ and /dysnomia/ ProxyPass blocks. Requires mod_proxy, mod_proxy_http
# and mod_headers (all already enabled on this host).

    # --- DMARC overview (reverse proxy to gunicorn on 127.0.0.1:8001) ---
    <Location /dmarc>
        RequestHeader set X-Forwarded-Prefix /dmarc
    </Location>
    ProxyPass        /dmarc/    http://127.0.0.1:8001/
    ProxyPassReverse /dmarc/    http://127.0.0.1:8001/
    RedirectMatch 301 ^/dmarc$ /dmarc/
