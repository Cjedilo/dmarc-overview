{% extends "base.html" %}

{% block extra_head %}
<style>
    .login { max-width: 360px; margin: -3.5rem auto 3rem; background: var(--surface); border: 1px solid var(--border);
             border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem 1.5rem; }
    .login h2 { margin: 0 0 0.75rem; }
    .login label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.3rem; }
    .login input { width: 100%; padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: 7px;
                   background: var(--surface-2); color: var(--text); font: inherit; }
    .login button { margin-top: 1rem; padding: 0.5rem 1.1rem; border: none; border-radius: 7px;
                    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .login .error { color: var(--bad); font-size: 0.88rem; margin: 0 0 0.75rem; }
    @media (max-width: 800px) { .login { margin: -3rem 1rem 2rem; } }
</style>
{% endblock %}

{% block status %}{% endblock %}

{% block layout %}
<form class="login" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <h2>Log in</h2>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <label for="password">Password for {{ domain }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
</form>
{% endblock %}
